[package]
name = "converge"
version = "0.1.0"
edition = "2021"
description = "Agentic coding CLI"
license = "MIT"

[[bin]]
name = "converge"
path = "src/main.rs"

[[bin]]
name = "converge-isolated"
path = "src/bin/converge-isolated.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
