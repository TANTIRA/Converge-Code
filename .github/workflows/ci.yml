name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Governance files and Rust tests
        shell: bash
        run: |
          set -euo pipefail
          for f in AGENTS.md SECURITY.md POLICY.md docs/README.md; do
            if [[ ! -f "$f" ]]; then
              echo "missing required file: $f" >&2
              exit 1
            fi
          done
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --component rustfmt
            # shellcheck source=/dev/null
            source "${HOME}/.cargo/env"
          fi
          rustup component add rustfmt
          cargo fmt --check
          cargo test

  live:
    name: live
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Live model call
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONVERGE_PROVIDER: anthropic
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "skipping live model call"
            exit 0
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y
            # shellcheck source=/dev/null
            source "${HOME}/.cargo/env"
          fi
          cargo run --quiet --bin converge -- -p "reply with ok" --test true
